name: Branch Protection Drift Check

# Verifies that the live GitHub branch-protection rules on `main` and
# `release` match the documented values in `docs/runbooks/branch-protection.md`.
# If they drift, this check fails so a human re-applies (or knowingly
# updates) the rules.
#
# Scope note: this asserts the four things this repo actually configures --
# required status checks exist, admins cannot bypass, and force-pushes and
# deletions are blocked. It deliberately does NOT assert required reviews,
# signed commits or linear history. This is a single-maintainer project with
# no second approver available, so those were never going to be turned on,
# and a check that asserts rules nobody intends to apply is not a drift
# detector -- it is a permanently red job that teaches people to ignore it.
#
# The check requires a token with `administration:read` scope on the repo
# (GITHUB_TOKEN does not have enough scope). Provide it as a repo secret
# named `BRANCH_PROTECTION_TOKEN`. If the secret is unset the job exits
# with a warning — it fails **open**, not closed.

on:
  pull_request:
    paths:
      - ".github/workflows/test.yml"
      - ".github/workflows/docker.yml"
      - ".github/workflows/branch-protection-check.yml"
      - "docs/runbooks/branch-protection.md"
  schedule:
    # Weekly drift check, Monday 14:00 UTC.
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify branch protection matches runbook
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify drift
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::BRANCH_PROTECTION_TOKEN secret is not set."
            echo "::warning::Skipping drift check — cannot read branch protection without admin scope."
            echo "::warning::See docs/runbooks/branch-protection.md § Known limitations."
            exit 0
          fi

          fail=0

          check_branch() {
            local branch="$1"

            echo "::group::Branch: ${branch}"

            local payload
            if ! payload=$(gh api "repos/${REPO}/branches/${branch}/protection" 2>&1); then
              echo "::error::Could not fetch protection for ${branch}: ${payload}"
              fail=1
              echo "::endgroup::"
              return
            fi

            local enforce_admins force_push deletions

            enforce_admins=$(jq -r '.enforce_admins.enabled // false' <<<"${payload}")
            force_push=$(jq -r '.allow_force_pushes.enabled // false' <<<"${payload}")
            deletions=$(jq -r '.allow_deletions.enabled // false' <<<"${payload}")

            [ "${enforce_admins}" = "true" ]  || { echo "::error::${branch}: enforce_admins must be true"; fail=1; }
            [ "${force_push}"     = "false" ] || { echo "::error::${branch}: allow_force_pushes must be false"; fail=1; }
            [ "${deletions}"      = "false" ] || { echo "::error::${branch}: allow_deletions must be false"; fail=1; }

            # Required status checks must exist. GitHub reports them in two
            # places -- the legacy flat `contexts` array and the newer
            # `checks[].context` -- and which one is populated depends on how
            # the rule was created, so union both before deciding it is empty.
            local actual count
            actual=$(jq -r '
              [ (.required_status_checks.contexts[]? // empty),
                (.required_status_checks.checks[]?.context // empty) ]
              | unique | .[]' <<<"${payload}")
            count=$(printf '%s' "${actual}" | grep -c . || true)

            if [ "${count}" -eq 0 ]; then
              echo "::error::${branch}: required_status_checks has no contexts -- every check is advisory, so a red PR can still merge"
              fail=1
            else
              # Not asserted against a fixed list on purpose: pinning exact
              # names here is what made this check drift in the first place,
              # since jobs get renamed and sharded far more often than the
              # protection rules get revisited. Print them instead so a human
              # reviewing this run can see what is actually gating merges.
              echo "${count} required status check(s):"
              # Quoted + sed rather than `printf '  - %s\n' ${actual}`: the
              # names contain spaces, and unquoted expansion would split
              # "Backend Tests (Shard 1/4)" into four bullets.
              printf '%s\n' "${actual}" | sed 's/^/  - /'
            fi

            echo "::endgroup::"
          }

          check_branch main
          check_branch release

          if [ "${fail}" -ne 0 ]; then
            echo "::error::Branch protection has drifted from docs/runbooks/branch-protection.md."
            echo "::error::Either re-apply the rules (see the runbook) or update both the runbook and this workflow in the same PR."
            exit 1
          fi

          echo "Branch protection matches the runbook."
